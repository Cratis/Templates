spring.application.name=CratisApp

# Route calculation: skipping the domain package (com.example) and the feature
# package (somemodule.somefeature.registration) makes routes /api/<command-or-query>.
cratis.arc.endpoints.segments-to-skip-for-route=5

# The Chronicle event store this application appends to and reads from.
cratis.chronicle.event-store=CratisApp
