<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ExtensionNamePanel</title>
<style>
  body { margin: 0; font-family: sans-serif; color: #1e1b4b; }
  section { padding: 16px; border: 1px dashed #818cf8; border-radius: 8px; background: #eef2ff; }
  p { margin: 0 0 8px; }
  .button { display: inline-block; padding: 4px 12px; border-radius: 4px; background: #4f46e5; color: #ffffff; }
</style>
</head>
<body>
<!-- Static HTML: design tools draw this in place of the component. No script, no event handlers, no external files. -->
<section>
  <p>Hello|Ada|en</p>
  <span class="button">Greet</span>
</section>
</body>
</html>
