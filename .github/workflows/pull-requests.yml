name: PR Prerelease

env:
  NUGET_OUTPUT: ./Artifacts/NuGet
  NUGET_SOURCE: https://nuget.pkg.github.com/cratis/index.json
  DOTNET8_VERSION: "8.0.407"
  DOTNET9_VERSION: "9.0.x"
  DOTNET11_VERSION: "11.0.x"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - "**"
    paths:
      - "Cratis.Templates.csproj"
      - "Cratis.Templates.Extensions.csproj"
      - "Templates/**"
      - ".github/workflows/**"

# The repository default token permission may be read-only; each job declares the write scopes it uses.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Release
        id: release
        uses: cratis/release-action@v1

  # Packs the pull request's code with a read-only token; publishing happens in a separate job that runs no pull request code.
  pack-nuget-package:
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .Net
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            ${{ env.DOTNET8_VERSION }}
            ${{ env.DOTNET9_VERSION }}
            ${{ env.DOTNET11_VERSION }}

      - name: Remove any existing artifacts
        run: rm -rf ${{ env.NUGET_OUTPUT }}

      - name: Restore
        run: dotnet restore Cratis.Templates.csproj

      - name: Create NuGet package
        run: dotnet pack Cratis.Templates.csproj --no-build --configuration Debug -o ${{ env.NUGET_OUTPUT }} -p:PackageVersion=${{ needs.release.outputs.version }}

      - name: Upload NuGet package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-package
          path: ${{ env.NUGET_OUTPUT }}/*.nupkg
          retention-days: 1
          if-no-files-found: error

  publish-nuget-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release, pack-nuget-package]
    permissions:
      packages: write
      pull-requests: write

    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-package
          path: ${{ env.NUGET_OUTPUT }}

      - name: Setup .Net
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET9_VERSION }}

      - name: Add GitHub Package Registry to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget add source --name github --username cratis --password "$NUGET_API_KEY" --store-password-in-clear-text "$NUGET_SOURCE"

      - name: Push NuGet package
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push "$NUGET_OUTPUT/*.nupkg" --skip-duplicate --timeout 900 --api-key "$NUGET_API_KEY" --source "github"

      - name: Add comment for NuGet package
        uses: mshick/add-pr-comment@a96c578acba98b60f16c6866d5f20478dc4ef68b # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          message: |
            NuGet package for this PR:
            Cratis.Templates ${{ needs.release.outputs.version }}

            Install with:
            dotnet new install Cratis.Templates::${{ needs.release.outputs.version }} --nuget-source https://nuget.pkg.github.com/cratis/index.json

            Package page:
            https://github.com/orgs/cratis/packages/nuget/package/Cratis.Templates
          allow-repeats: false
