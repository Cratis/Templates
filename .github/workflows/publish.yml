name: Publish

env:
  NUGET_OUTPUT: ./Artifacts/NuGet
  DOTNET8_VERSION: "8.0.407"
  DOTNET9_VERSION: "9.0.x"
  DOTNET10_VERSION: "10.0.x"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: '0.0.0'
        type: string
      release-notes:
        description: 'Release notes'
        required: true
        default: 'No release notes'
        type: string
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
  # Releasing on push rather than on the pull_request closed event is deliberate. A pull request from a fork
  # runs with a read-only GITHUB_TOKEN and no secrets even on merge, so it cannot create the release or reach
  # the publishing credentials - which is how a merged, labeled fork contribution silently released nothing.
  # A push to main always runs with a full-permission token, and the release action finds the merged pull
  # request and its label from the commit.
  push:
    # Only main releases. On "**" every base branch released, so merging one pull
    # request into another one's branch - the ordinary way to stack work - cut and published a version
    # from a branch that was still in review. That is how Cratis.Fundamentals v7.17.0 came to be
    # published from the head of an open pull request, carrying every unmerged change on that branch
    # under release notes describing only the one that had just merged. A release must come from the
    # branch that is released.
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}
      reason: ${{ steps.release.outputs.reason }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # release-action creates the GitHub release from its success-only post step. Keep every
      # publication and verification step below the action in this same job: if NuGet rejects the
      # package, the job fails and no tag or GitHub release is created for an unavailable artifact.
      - name: Determine release
        id: release
        uses: cratis/release-action@v1
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}

      - name: Setup .NET
        if: steps.release.outputs.should-publish == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET8_VERSION }}
            ${{ env.DOTNET9_VERSION }}
            ${{ env.DOTNET10_VERSION }}

      - name: Create NuGet package
        if: steps.release.outputs.should-publish == 'true'
        run: |
          rm -rf "${{ env.NUGET_OUTPUT }}"
          dotnet restore Cratis.Templates.csproj
          dotnet pack Cratis.Templates.csproj --no-restore --configuration Release -o "${{ env.NUGET_OUTPUT }}" -p:PackageVersion=${{ steps.release.outputs.version }}

      - name: NuGet trusted-publishing login
        if: steps.release.outputs.should-publish == 'true'
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
          token-service-url: https://www.nuget.org/api/v2/token
          audience: https://www.nuget.org

      - name: Push NuGet package
        if: steps.release.outputs.should-publish == 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push --skip-duplicate '${{ env.NUGET_OUTPUT }}/*.nupkg' --timeout 900 --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

      - name: Verify the published package
        if: steps.release.outputs.should-publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          package_file="$RUNNER_TEMP/cratis.templates.${version}.nupkg"
          package_url="https://api.nuget.org/v3-flatcontainer/cratis.templates/${version}/cratis.templates.${version}.nupkg"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location "$package_url" --output "$package_file"; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo "::error::Cratis.Templates ${version} was not downloadable from NuGet after 5 minutes"
              exit 1
            fi
            echo "Package is not indexed yet (attempt ${attempt}/30); retrying in 10 seconds"
            sleep 10
          done

          dotnet new install "$package_file"
          validation_root="$RUNNER_TEMP/published-template"
          dotnet new cratis -n ValidatePublished -o "$validation_root" --Framework net10.0 --allow-scripts Yes
          dotnet build "$validation_root/ValidatePublished.csproj" --configuration Release

  verify-published:
    # A merge that publishes nothing is the failure mode that silently costs a release: the release job
    # succeeds, every publish job is skipped for want of should-publish, and the whole run reports green. Fail
    # instead, so a release that did not happen cannot be mistaken for one that did.
    #
    # Only for the reasons that mean something went wrong. Publishing nothing is correct and routine for the
    # others - a commit pushed straight to main, a Dependabot merge, a re-run of a run that already released -
    # and failing on those would make this job noise that everyone learns to ignore.
    if: always() && needs.release.result == 'success' && contains(fromJSON('["no-label", "error"]'), needs.release.outputs.reason)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [release]

    steps:
      - name: Report that nothing was published
        run: |
          echo "::error::Nothing was published and no release was cut (reason: ${{ needs.release.outputs.reason }}). For 'no-label', add exactly one of major, minor or patch to the merged pull request and re-run this workflow - see verify-semver-label, which is meant to catch this before the merge."
          exit 1
