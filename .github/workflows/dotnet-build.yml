name: .NET Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET8_VERSION: "8.0.407"
  DOTNET9_VERSION: "9.0.x"
  DOTNET10_VERSION: "10.0.x"

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
  push:
    branches:
      - "main"
    paths:
      - "Cratis.Templates.csproj"
      - "Cratis.Templates.Kotlin.csproj"
      - "Cratis.Templates.Java.csproj"
      - "Templates/**"
      - "verify-asset-layout.sh"
      - "verify-registration-identity.sh"
      - "Verification/**"
      - ".github/workflows/dotnet-build.yml"
  pull_request:
    branches:
      - "**"
    paths:
      - "Cratis.Templates.csproj"
      - "Cratis.Templates.Kotlin.csproj"
      - "Cratis.Templates.Java.csproj"
      - "Templates/**"
      - "verify-asset-layout.sh"
      - "verify-registration-identity.sh"
      - "Verification/**"
      - ".github/workflows/dotnet-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET8_VERSION }}
            ${{ env.DOTNET9_VERSION }}
            ${{ env.DOTNET10_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'latest'
          package-manager-cache: false

      - name: Install Yarn
        run: npm install -g yarn

      - name: Generate NuGet.config
        shell: bash
        run: |
          cat > NuGet.config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
          </configuration>
          EOF

      - name: Restore
        run: dotnet restore Cratis.Templates.csproj --configfile ./NuGet.config

      - name: Build
        run: |
          dotnet build Cratis.Templates.csproj --configuration Release --no-restore
          dotnet build Cratis.Templates.Kotlin.csproj --configuration Release --no-restore
          dotnet build Cratis.Templates.Java.csproj --configuration Release --no-restore

      - name: Validate package
        run: |
          dotnet pack Cratis.Templates.csproj --no-build --no-restore --configuration Release -o ./Artifacts/NuGet -p:PackageVersion=0.0.0-ci
          dotnet pack Cratis.Templates.Kotlin.csproj --no-build --no-restore --configuration Release -o ./Artifacts/NuGet -p:PackageVersion=0.0.0-ci
          dotnet pack Cratis.Templates.Java.csproj --no-build --no-restore --configuration Release -o ./Artifacts/NuGet -p:PackageVersion=0.0.0-ci

      - name: Validate templates generate buildable projects
        timeout-minutes: 35
        shell: bash
        run: |
          ./install-local.sh

          validation_root="$(mktemp -d)"
          echo "Using validation root: $validation_root"

          # Carried into the asset-layout step, which verifies the applications
          # generated here rather than scaffolding its own.
          echo "validation_root=$validation_root" >> "$GITHUB_ENV"

          # Copy NuGet.config to the validation root so that dotnet restore
          # (which runs inside subdirectories of validation_root) can walk up
          # and find it, ensuring only nuget.org is used as a package source.
          cp NuGet.config "$validation_root/NuGet.config"

          run_dotnet_new() {
            "$@"
          }

          build_generated_project() {
            local project_root="$1"
            local solution_file
            local project_file

            solution_file="$(find "$project_root" -maxdepth 1 -name '*.sln' | head -n 1)"
            if [[ -n "$solution_file" ]]; then
              dotnet restore "$solution_file" --configfile "$validation_root/NuGet.config"
              dotnet build "$solution_file" --configuration Release --no-restore
              return
            fi

            project_file="$(find "$project_root" -maxdepth 1 -name '*.csproj' | head -n 1)"
            if [[ -z "$project_file" ]]; then
              echo "No .sln or .csproj found in $project_root"
              return 1
            fi

            dotnet restore "$project_file" --configfile "$validation_root/NuGet.config"
            dotnet build "$project_file" --configuration Release --no-restore
          }

          run_dotnet_new dotnet new cratis-chronicle-console -n ValidateChronicleConsole -o "$validation_root/ValidateChronicleConsole" --Framework net10.0
          build_generated_project "$validation_root/ValidateChronicleConsole"

          run_dotnet_new dotnet new cratis-chronicle-web -n ValidateChronicleWeb -o "$validation_root/ValidateChronicleWeb" --Framework net10.0
          build_generated_project "$validation_root/ValidateChronicleWeb"

          run_dotnet_new dotnet new cratis -n ValidateCratis -o "$validation_root/ValidateCratis" --Framework net10.0 --packageManager none --allow-scripts Yes
          build_generated_project "$validation_root/ValidateCratis"

          # No --allow-scripts here: this template declares no run-script
          # post-action, so dotnet new does not offer the option and rejects it
          # outright. It also has no packageManager symbol, so it installs no
          # frontend dependencies of its own - verify-asset-layout.sh does that.
          run_dotnet_new dotnet new cratis-aspire -n ValidateCratisAspire -o "$validation_root/ValidateCratisAspire" --Framework net10.0
          build_generated_project "$validation_root/ValidateCratisAspire"

          # A non-default database proves the Entity Framework Core package path,
          # the conditional csproj wiring, and the preprocessor branches compile.
          run_dotnet_new dotnet new cratis -n ValidateCratisPostgreSql -o "$validation_root/ValidateCratisPostgreSql" --Framework net10.0 --packageManager none --Database PostgreSQL --allow-scripts Yes
          build_generated_project "$validation_root/ValidateCratisPostgreSql"
          run_dotnet_new dotnet new cratis-aspire -n ValidateCratisAspirePostgreSql -o "$validation_root/ValidateCratisAspirePostgreSql" --Framework net10.0 --Database PostgreSQL
          build_generated_project "$validation_root/ValidateCratisAspirePostgreSql"

          run_dotnet_new dotnet new cratis -n Mesta.Reporting.App -o "$validation_root/DottedCratis" --Framework net10.0 --packageManager none --allow-scripts No
          build_generated_project "$validation_root/DottedCratis"
          run_dotnet_new dotnet new cratis -n Mesta.Reporting.App -o "$validation_root/DottedCratisPostgreSql" --Framework net10.0 --packageManager none --Database PostgreSQL --allow-scripts Yes
          build_generated_project "$validation_root/DottedCratisPostgreSql"
          run_dotnet_new dotnet new cratis-aspire -n Mesta.Reporting.App -o "$validation_root/DottedCratisAspire" --Framework net10.0 --Database PostgreSQL
          build_generated_project "$validation_root/DottedCratisAspire"
          run_dotnet_new dotnet new cratis-chronicle-console -n Mesta.Reporting.App -o "$validation_root/DottedChronicleConsole" --Framework net10.0
          build_generated_project "$validation_root/DottedChronicleConsole"
          run_dotnet_new dotnet new cratis-chronicle-web -n Mesta.Reporting.App -o "$validation_root/DottedChronicleWeb" --Framework net10.0
          build_generated_project "$validation_root/DottedChronicleWeb"

      - name: Validate scaffolded files that a build does not exercise
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          # NuGet drops files whose names start with a dot unless default excludes are off,
          # and a template conditional the engine cannot parse silently removes its block.
          # Both still compile, so check the scaffolded output directly.
          checked=0
          failed=0
          expect_file() {
            checked=$((checked + 1))
            if [[ ! -f "$1" ]]; then
              echo "::error::missing scaffolded file: $1"
              failed=1
            fi
          }
          expect_text() {
            checked=$((checked + 1))
            if ! grep -qF -- "$2" "$1"; then
              echo "::error::$1 does not contain: $2"
              failed=1
            fi
          }
          for app in ValidateChronicleConsole ValidateChronicleWeb ValidateCratis ValidateCratisAspire ValidateCratisPostgreSql ValidateCratisAspirePostgreSql; do
            expect_file "$validation_root/$app/.gitignore"
          done
          for app in ValidateCratis ValidateCratisPostgreSql ValidateCratisAspire/ValidateCratisAspire ValidateCratisAspirePostgreSql/ValidateCratisAspirePostgreSql; do
            expect_file "$validation_root/$app/.yarnrc.yml"
          done
          expect_text "$validation_root/ValidateCratis/ValidateCratis.csproj" '<CratisReadProtection>On</CratisReadProtection>'
          expect_text "$validation_root/ValidateCratisAspire/ValidateCratisAspire/ValidateCratisAspire.csproj" '<CratisReadProtection>On</CratisReadProtection>'
          expect_text "$validation_root/ValidateCratisPostgreSql/ValidateCratisPostgreSql.csproj" '<CratisReadProtection>On</CratisReadProtection>'
          expect_text "$validation_root/ValidateCratisAspirePostgreSql/ValidateCratisAspirePostgreSql/ValidateCratisAspirePostgreSql.csproj" '<CratisReadProtection>On</CratisReadProtection>'
          expect_text "$validation_root/ValidateCratisAspirePostgreSql/ValidateCratisAspirePostgreSql.Composition/Program.cs" ".WithReference(readModels)"
          expect_text "$validation_root/ValidateCratisPostgreSql/appsettings.json" '"DefaultSinkTypeId": "SQL"'
          expect_text "$validation_root/ValidateCratisAspirePostgreSql/ValidateCratisAspirePostgreSql/appsettings.json" '"DefaultSinkTypeId": "SQL"'
          # Every published compose port must bind to loopback only.
          for app in ValidateChronicleConsole ValidateChronicleWeb ValidateCratis ValidateCratisPostgreSql; do
            compose="$validation_root/$app/docker-compose.yml"
            checked=$((checked + 1))
            if grep -nE '^[[:space:]]*-[[:space:]]*"?[0-9]+:[0-9]+"?[[:space:]]*$' "$compose"; then
              echo "::error::$compose publishes a port that is not bound to 127.0.0.1"
              failed=1
            fi
            expect_text "$compose" "- 127.0.0.1:"
          done
          # MongoDB scaffolds must not emit the EF DbContext; relational ones keep it.
          checked=$((checked + 1))
          if [[ -n "$(find "$validation_root/ValidateCratis" -name '*DbContext.cs' -print -quit)" ]]; then
            echo "::error::MongoDB scaffold ValidateCratis contains a DbContext"
            failed=1
          fi
          checked=$((checked + 1))
          if [[ -z "$(find "$validation_root/ValidateCratisPostgreSql" -name '*DbContext.cs' -print -quit)" ]]; then
            echo "::error::PostgreSQL scaffold ValidateCratisPostgreSql is missing its DbContext"
            failed=1
          fi
          echo "Checked $checked scaffolded expectations"
          exit "$failed"

      - name: Validate project-name derived settings
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          node Verification/ProjectNames/verify-project-names.mjs --name ValidateCratis web="$validation_root/ValidateCratis"
          node Verification/ProjectNames/verify-project-names.mjs --name ValidateCratisPostgreSql web="$validation_root/ValidateCratisPostgreSql"
          node Verification/ProjectNames/verify-project-names.mjs --name ValidateCratisAspire aspire="$validation_root/ValidateCratisAspire"
          node Verification/ProjectNames/verify-project-names.mjs --name ValidateCratisAspirePostgreSql aspire="$validation_root/ValidateCratisAspirePostgreSql"
          node Verification/ProjectNames/verify-project-names.mjs --name ValidateChronicleConsole console="$validation_root/ValidateChronicleConsole"
          node Verification/ProjectNames/verify-project-names.mjs --name ValidateChronicleWeb chronicle-web="$validation_root/ValidateChronicleWeb"
          node Verification/ProjectNames/verify-project-names.mjs --name Mesta.Reporting.App \
            web="$validation_root/DottedCratis" web="$validation_root/DottedCratisPostgreSql" \
            aspire="$validation_root/DottedCratisAspire" console="$validation_root/DottedChronicleConsole" \
            chronicle-web="$validation_root/DottedChronicleWeb"

      - name: Validate registration returns the persisted identity
        timeout-minutes: 10
        shell: bash
        run: |
          ./verify-registration-identity.sh \
            "$validation_root/ValidateCratis" \
            "$validation_root/ValidateCratisAspire/ValidateCratisAspire"

      - name: Install and lint latest frontend dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          for app in "$validation_root/ValidateCratis" "$validation_root/ValidateCratisAspire/ValidateCratisAspire"; do
            (
              cd "$app"
              npm install --no-audit --no-fund
              compiler_version="$(node -p "require('./node_modules/@typescript/native/package.json').version")"
              test "$(./node_modules/.bin/tsc --version)" = "Version $compiler_version"
              npm run lint

              # Generated AI tooling under .cratis/ is globally ignored by lint.
              violation=$'debugger;\nvar unused = 1;\n'
              mkdir -p .cratis/ai/harnesses/pi/extensions
              printf '%s' "$violation" > .cratis/ai/harnesses/pi/extensions/fixture.ts
              npm run lint
              rm -rf .cratis/ai/harnesses/pi/extensions/fixture.ts

              # Negative control: the same violation in application source must fail lint.
              printf '%s' "$violation" > fixture-violation.ts
              if npm run lint; then
                echo "::error::lint did not flag a violation in application source"
                exit 1
              fi
              rm -f fixture-violation.ts
            )
          done

      - name: Validate scaffolded frontends serve their assets from /assets/
        timeout-minutes: 15
        shell: bash
        run: |
          ./verify-asset-layout.sh \
            "$validation_root/ValidateCratis" \
            "$validation_root/ValidateCratisAspire/ValidateCratisAspire"

  kotlin-java-templates:
    # Validates the JVM templates end to end: scaffold with dotnet new, compile the
    # generated Gradle project with a real JDK (which also runs the Arc Gradle plugin's
    # TypeScript proxy generation), then compile-check the frontend against the
    # generated proxies with the same npm packages the template declares.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET10_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'latest'
          package-manager-cache: false

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install templates locally
        shell: bash
        run: |
          ./install-local.sh
          dotnet new list | grep 'cratis *\[C#\],Java,Kotlin'

      - name: Scaffold JVM template applications
        timeout-minutes: 5
        shell: bash
        run: |
          validation_root="$(mktemp -d)"
          echo "Using validation root: $validation_root"
          echo "validation_root=$validation_root" >> "$GITHUB_ENV"

          dotnet new cratis -n ValidateCratisKotlin -o "$validation_root/ValidateCratisKotlin" --language Kotlin --packageManager none --allow-scripts Yes
          dotnet new cratis -n ValidateCratisJava -o "$validation_root/ValidateCratisJava" --language Java --packageManager none --allow-scripts Yes
          # A non-default database proves the SQL sink switch and compose tokens scaffold.
          dotnet new cratis -n ValidateCratisKotlinSqlite -o "$validation_root/ValidateCratisKotlinSqlite" --language Kotlin --packageManager none --Database SQLite --allow-scripts Yes
          dotnet new cratis -n ValidateCratisJavaPostgreSql -o "$validation_root/ValidateCratisJavaPostgreSql" --language Java --packageManager none --Database PostgreSQL --allow-scripts Yes
          dotnet new cratis -n Mesta.Reporting.App -o "$validation_root/DottedCratisJava" --language Java --packageManager none --allow-scripts Yes
          dotnet new cratis -n Mesta.Reporting.App -o "$validation_root/DottedCratisKotlin" --language Kotlin --packageManager none --allow-scripts Yes

      - name: Validate scaffolded dotfiles
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          # NuGet drops files whose names start with a dot unless default excludes are off.
          checked=0
          failed=0
          for app in ValidateCratisKotlin ValidateCratisJava; do
            for file in .gitignore .yarnrc.yml; do
              checked=$((checked + 1))
              if [[ ! -f "$validation_root/$app/$file" ]]; then
                echo "::error::missing scaffolded file: $app/$file"
                failed=1
              fi
            done
          done
          # Every published compose port must bind to loopback only.
          for app in ValidateCratisKotlin ValidateCratisJava ValidateCratisKotlinSqlite ValidateCratisJavaPostgreSql; do
            compose="$validation_root/$app/docker-compose.yml"
            checked=$((checked + 1))
            if grep -nE '^[[:space:]]*-[[:space:]]*"?[0-9]+:[0-9]+"?[[:space:]]*$' "$compose"; then
              echo "::error::$compose publishes a port that is not bound to 127.0.0.1"
              failed=1
            fi
            if ! grep -qF -- "- 127.0.0.1:" "$compose"; then
              echo "::error::$compose has no loopback-bound port"
              failed=1
            fi
          done
          echo "Checked $checked scaffolded files"
          exit "$failed"

      - name: Build scaffolded Kotlin application
        timeout-minutes: 20
        shell: bash
        run: |
          cd "$validation_root/ValidateCratisKotlin"
          sh ./gradlew build --no-daemon
          test -f build/generated/arc-proxies/Register.ts
          test -f build/generated/arc-proxies/All.ts
          test -f build/generated/arc-proxies/Listing.ts

      - name: Build scaffolded Java application
        timeout-minutes: 20
        shell: bash
        run: |
          cd "$validation_root/ValidateCratisJava"
          sh ./gradlew build --no-daemon
          test -f build/generated/arc-proxies/Register.ts
          test -f build/generated/arc-proxies/All.ts
          test -f build/generated/arc-proxies/Listing.ts

      - name: Build scaffolded Java application with a dotted name
        timeout-minutes: 20
        shell: bash
        run: |
          cd "$validation_root/DottedCratisJava"
          sh ./gradlew build --no-daemon
          test -f build/generated/arc-proxies/Register.ts

      - name: Validate JVM project-name derived settings
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          node Verification/ProjectNames/verify-project-names.mjs --name Mesta.Reporting.App jvm="$validation_root/DottedCratisJava" jvm-scaffold="$validation_root/DottedCratisKotlin"
          node Verification/ProjectNames/verify-project-names.mjs --name ValidateCratisJava jvm="$validation_root/ValidateCratisJava"
          node Verification/ProjectNames/verify-project-names.mjs --name ValidateCratisKotlin jvm="$validation_root/ValidateCratisKotlin"
          node Verification/ProjectNames/verify-project-names.mjs --name ValidateCratisJavaPostgreSql jvm-scaffold="$validation_root/ValidateCratisJavaPostgreSql"
          node Verification/ProjectNames/verify-project-names.mjs --name ValidateCratisKotlinSqlite jvm-scaffold="$validation_root/ValidateCratisKotlinSqlite"

      - name: Build scaffolded JVM applications with a non-default database
        timeout-minutes: 30
        shell: bash
        run: |
          # The SQL sink path compiles identically; the scaffold proves the
          # Database symbol, derived sink switch, and compose tokens resolve.
          cd "$validation_root/ValidateCratisKotlinSqlite"
          sh ./gradlew build --no-daemon
          cd "$validation_root/ValidateCratisJavaPostgreSql"
          sh ./gradlew build --no-daemon

      - name: Type-check and build scaffolded frontends
        timeout-minutes: 15
        shell: bash
        run: |
          # The generated proxies land under build/generated/arc-proxies, which the
          # frontend consumes through the Api alias, so a full build proves the
          # generated TypeScript matches the npm packages the template pins.
          for app in "$validation_root/ValidateCratisKotlin" "$validation_root/ValidateCratisJava"; do
            (
              cd "$app"
              npm install --no-audit --no-fund
              npm run build
            )
          done
